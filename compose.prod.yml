
name: foundation

services:
  postgres:
    image: postgres:18.3
    container_name: foundation_db
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-foundation}
      POSTGRES_DB: ${POSTGRES_DB:-foundation_db}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password

    secrets:
      - postgres_password

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    networks:
      - foundation_network

    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7.4
    container_name: foundation_cache
    restart: unless-stopped

    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf

    secrets:
      - source: redis_config
        target: /usr/local/etc/redis/redis.conf

    ports:
      - "127.0.0.1:6379:6379"

    volumes:
      - redis_data:/data

    networks:
      - foundation_network

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: foundation_object_storage
    restart: unless-stopped

    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password

    secrets:
      - minio_root_user
      - minio_root_password

    command: server /data --console-address ":9001"

    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

    volumes:
      - minio_data:/data

    networks:
      - foundation_network

  kafka:
    image: apache/kafka:3.9.1
    container_name: foundation_messenger
    hostname: kafka
    restart: unless-stopped

    ports:
      - "127.0.0.1:9092:9092"

    volumes:
      - kafka_data:/var/lib/kafka/data

    networks:
      - foundation_network

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

volumes:
  postgres_data:
  redis_data:
  minio_data:
  kafka_data:

secrets:
  postgres_password:
    file: /var/lib/foundation/secrets/postgres_password

  redis_config:
    file: /var/lib/foundation/secrets/redis.conf

  minio_root_user:
    file: /var/lib/foundation/secrets/minio_root_user

  minio_root_password:
    file: /var/lib/foundation/secrets/minio_root_password

networks:
  foundation_network:
    driver: bridge
