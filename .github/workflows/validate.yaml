
name: Foundation CI Validation

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Validate Bash syntax
        shell: bash
        run: |
          find scripts -type f -name "*.sh" -print0 |
            xargs -0 -r bash -n

      - name: Analyze Bash scripts
        shell: bash
        run: |
          find scripts -type f -name "*.sh" -print0 |
            xargs -0 -r shellcheck

      - name: Validate Docker Compose
        env:
          POSTGRES_USER: foundation
          POSTGRES_PASSWORD: ci-placeholder
          POSTGRES_DB: foundation_db
          REDIS_PASSWORD: ci-placeholder
          MINIO_ROOT_USER: foundation
          MINIO_ROOT_PASSWORD: ci-placeholder
        run: |
          docker compose -f compose.prod.yml config --quiet

      - name: Validate required files
        shell: bash
        run: |
          required_files=(
            "scripts/bootstrap.sh"
            "compose.prod.yml"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Missing required file: $file"
              exit 1
            fi
          done

          echo "All required files are present."
