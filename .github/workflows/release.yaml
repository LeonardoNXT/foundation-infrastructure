
name: Foundation Release

on:
  workflow_run:
    workflows:
      - Foundation CI Validation
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  release:
    name: Publish Foundation artifact
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == 'LeonardoNXT/foundation-infrastructure'
      }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Package infrastructure
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_SHA="${{ github.event.workflow_run.head_sha }}"

          mkdir -p dist

          tar -czf dist/foundation-infra.tar.gz \
            compose.prod.yml \
            scripts/

          (
            cd dist
            sha256sum foundation-infra.tar.gz > foundation-infra.tar.gz.sha256
          )

          echo "Release: $RELEASE_SHA"
          ls -lh dist/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::633697459676:role/FoundationGitHubReleaseRole
          aws-region: sa-east-1

      - name: Upload artifact to S3
        shell: bash
        env:
          BUCKET: foundation-infra-artifacts-dev-633697459676-sa-east-1-an
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          PREFIX="s3://${BUCKET}/releases/${RELEASE_SHA}"

          aws s3 cp \
            dist/foundation-infra.tar.gz \
            "${PREFIX}/foundation-infra.tar.gz"

          aws s3 cp \
            dist/foundation-infra.tar.gz.sha256 \
            "${PREFIX}/foundation-infra.tar.gz.sha256"

          echo "Release published: ${PREFIX}"
