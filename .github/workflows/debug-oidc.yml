
name: Debug GitHub OIDC

on:
  workflow_dispatch:

permissions:
  id-token: write

jobs:
  inspect-oidc:
    runs-on: ubuntu-latest

    steps:
      - name: Inspect OIDC with JavaScript
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken("sts.amazonaws.com");

            const [, encodedPayload] = token.split(".");

            const payload = JSON.parse(
              Buffer.from(encodedPayload, "base64url").toString("utf8")
            );

            const {
              iss,
              aud,
              sub,
              repository,
              repository_id,
              repository_owner,
              repository_owner_id,
              ref,
              ref_type,
            } = payload;

            console.log(JSON.stringify({
              iss,
              aud,
              sub,
              repository,
              repository_id,
              repository_owner,
              repository_owner_id,
              ref,
              ref_type,
            }, null, 2));
