
name: Debug GitHub OIDC

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  inspect-oidc:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node 24 
        uses: actions/setup-node@v4
        with:
          node-version: '24' 
      
      - name: Install DEBUG OIDC dependencies
        working-directory: ./.github/actions/debug-oidc
        run: npm install
      - name: Build DEBUG OIDC
        working-directory: ./.github/actions/debug-oidc
        run: npm run build

      - name: Execute DEBUG OIDC Verification
        working-directory: ./.github/actions/debug-oidc
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL}}

        run: npm run start
          

