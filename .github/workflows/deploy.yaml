
name: Foundation Deployment

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Full commit SHA to deploy"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Foundation Deployment
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Validate release SHA
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          if [[ ! "$RELEASE_SHA" =~ ^[a-fA-F0-9]{40}$ ]]; then
            echo "::error::Invalid commit SHA"
            exit 1
          fi

      - name: Verify deployment configuration
        env:
            DEPLOY_ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
            AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
            echo "Role: $DEPLOY_ROLE"
            echo "Region: $AWS_REGION"

      - name: Inspect deployment OIDC claims
        shell: bash
        run: |
            TOKEN_RESPONSE=$(curl -fsSL \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

            TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.value')

            PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f 2)

            echo "$PAYLOAD" \
            | base64 -d 2>/dev/null \
            | jq '{aud, sub, repository, ref, environment}'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Send diagnostic command via SSM
        shell: bash
        env:
          INSTANCE_ID: ${{ vars.FOUNDATION_INSTANCE_ID }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"echo Foundation diagnostic deployment\",\"echo Release: ${RELEASE_SHA}\",\"whoami\",\"hostname\"]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent}' \
            --output json
